<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Recommendation - ProcureSense</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav>

        <div class="logo">
            🌾 ProcureSense
        </div>

        <div class="nav-links">
            <a href="farmer-dashboard.html">Dashboard</a>
        </div>

    </nav>


    <section class="booking-section">

        <div class="booking-box">

            <h1>🧠 Smart Recommendation</h1>

            <p>
                Enter your procurement details
            </p>


            <label>Crop</label>

            <select id="crop">

                <option value="">Select Crop</option>

                <option>Rice</option>

                <option>Wheat</option>

                <option>Cotton</option>

                <option>Maize</option>

            </select>


            <label>Quantity (Quintals)</label>

            <input
                type="number"
                id="quantity"
                placeholder="Enter quantity"
                min="1"
            >


            <label>Location</label>

            <select id="location">

                <option value="">Select Location</option>

                <option>Chittoor</option>

                <option>Tirupati</option>

                <option>Madanapalle</option>

            </select>


            <label>Preferred Date</label>

            <input type="date" id="date">


            <button onclick="getRecommendation()">
                🧠 Analyze & Recommend
            </button>


            <div id="result"></div>

        </div>

    </section>


    <script>

        // Store recommendation details
        let recommendedTime = "";
        let recommendedWaitingTime = "";
        let recommendedLoad = "";


        function getRecommendation() {

            let crop =
                document.getElementById("crop").value;

            let quantity =
                Number(document.getElementById("quantity").value);

            let location =
                document.getElementById("location").value;

            let date =
                document.getElementById("date").value;


            // Validation
            if (
                crop === "" ||
                quantity === 0 ||
                location === "" ||
                date === ""
            ) {

                alert("Please fill all details!");

                return;

            }


            if (quantity <= 0) {

                alert("Quantity must be greater than 0!");

                return;

            }


            /*
                SMART RECOMMENDATION LOGIC

                Low Load:
                1 - 10 quintals

                Medium Load:
                11 - 25 quintals

                High Load:
                Above 25 quintals
            */


            if (quantity <= 10) {

                recommendedLoad = "🟢 Low";

                recommendedWaitingTime = "15 minutes";

                recommendedTime = "10:00 AM - 11:00 AM";

            }

            else if (quantity <= 25) {

                recommendedLoad = "🟡 Medium";

                recommendedWaitingTime = "30 minutes";

                recommendedTime = "11:00 AM - 12:00 PM";

            }

            else {

                recommendedLoad = "🔴 High";

                recommendedWaitingTime = "45 minutes";

                recommendedTime = "12:00 PM - 01:00 PM";

            }


            // Display recommendation

            document.getElementById("result").innerHTML = `

                <div class="recommendation">

                    <h2>✅ Recommended Slot</h2>

                    <p>
                        <b>🌾 Crop:</b> ${crop}
                    </p>

                    <p>
                        <b>📦 Quantity:</b>
                        ${quantity} Quintals
                    </p>

                    <p>
                        <b>📍 Best Center:</b>
                        ${location} Procurement Center
                    </p>

                    <p>
                        <b>📅 Preferred Date:</b>
                        ${date}
                    </p>

                    <p>
                        <b>⏰ Recommended Time:</b>
                        ${recommendedTime}
                    </p>

                    <p>
                        <b>⏳ Expected Waiting Time:</b>
                        ${recommendedWaitingTime}
                    </p>

                    <p>
                        <b>📊 Center Load:</b>
                        ${recommendedLoad}
                    </p>

                    <button onclick="bookSlot()">
                        🎫 Accept & Book Slot
                    </button>

                </div>

            `;

        }


        function bookSlot() {

            let farmer =
                JSON.parse(
                    localStorage.getItem("loggedInFarmer")
                );


            if (!farmer) {

                alert("Please login first!");

                window.location.href = "farmer.html";

                return;

            }


            let crop =
                document.getElementById("crop").value;

            let quantity =
                document.getElementById("quantity").value;

            let location =
                document.getElementById("location").value;

            let date =
                document.getElementById("date").value;


            // Make sure recommendation was generated
            if (
                recommendedTime === "" ||
                recommendedWaitingTime === "" ||
                recommendedLoad === ""
            ) {

                alert("Please click Analyze & Recommend first!");

                return;

            }


            // Generate unique token
            let token =
                "TOK" +
                Math.floor(
                    1000 + Math.random() * 9000
                );


            // Create booking
            let booking = {

                token: token,

                farmerId: farmer.farmerId,

                farmerName: farmer.name,

                mobile: farmer.mobile,

                crop: crop,

                quantity: quantity,

                center:
                    location +
                    " Procurement Center",

                date: date,

                time: recommendedTime,

                waitingTime:
                    recommendedWaitingTime,

                load:
                    recommendedLoad,

                status: "Confirmed"

            };


            // Get existing bookings
            let bookings =
                JSON.parse(
                    localStorage.getItem(
                        "bookings_" +
                        farmer.farmerId
                    )
                ) || [];


            // Add new booking
            bookings.push(booking);


            // Save booking
            localStorage.setItem(

                "bookings_" +
                farmer.farmerId,

                JSON.stringify(bookings)

            );


            alert(

                "Slot booked successfully!\n\n" +

                "Your Token: " +
                token

            );


            // Go to farmer dashboard
            window.location.href =
                "farmer-dashboard.html";

        }

    </script>

</body>

</html>
